# limeyard scenario: estate
#
# The thing the old vuln_apps fleet could not do. Every app there was
# 127.0.0.1:70xx, one host and one HTTP port, so subdomain enumeration had
# nothing to enumerate, port scanning was handed its answer, and service
# fingerprinting never saw a non-HTTP daemon.
#
# This is a small routable estate on lime-lab with authoritative DNS. The zone
# file is the answer key. Docker network aliases are deliberately NOT used as
# the source of truth, because they never appear in a zone transfer and would
# make the topology disagree with scenario.yml.
#
# No host ports are published at all except the resolver, which is bound to
# loopback so you can dig it from the host.

# Hardened by limeyard. These containers are deliberately vulnerable and we
# achieve RCE inside them on purpose, so the container is the security boundary:
#   no-new-privileges  a setuid binary inside cannot escalate
#   cap_drop ALL       capabilities added back one at a time, per image
#   pids_limit         a fork bomb stays inside its own container
#   mem_limit          a DoS target cannot take the host down with it
# Run `./lime audit` to check these invariants still hold.

name: lime-scn-estate
networks:
  lime-lab:
    external: true
services:
  ns1:
    image: internetsystemsconsortium/bind9:9.20@sha256:a5c5fc5227be83dca0001ad72e2398be2aeb183c6ddf7e2ed41dba63c84e0021
    container_name: lime-estate-ns1
    volumes:
    - ./zones/named.conf:/etc/bind/named.conf:ro
    - ./zones/lab.test.db:/etc/bind/lab.test.db:ro
    - ./zones/closed.test.db:/etc/bind/closed.test.db:ro
    - ./zones/reverse.db:/etc/bind/reverse.db:ro
    ports:
    - 127.0.0.1:5353:53/tcp
    - 127.0.0.1:5353:53/udp
    networks:
      lime-lab:
        ipv4_address: 10.66.10.2
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add: &id002
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
    - NET_BIND_SERVICE
    - KILL
    pids_limit: 512
    mem_limit: 1500m
  www:
    image: traefik/whoami:latest@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
    container_name: lime-estate-www
    networks:
      lime-lab:
        ipv4_address: 10.66.10.10
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add: &id001
    - NET_BIND_SERVICE
    pids_limit: 512
    mem_limit: 768m
  api:
    image: traefik/whoami:latest@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
    container_name: lime-estate-api
    networks:
      lime-lab:
        ipv4_address: 10.66.10.11
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add: *id001
    pids_limit: 512
    mem_limit: 768m
  admin:
