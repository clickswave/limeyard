# The takeover impostor. It answers for the vendor hostnames the dangling
# CNAMEs point at, with the exact bodies the upstream detection templates match.
# Locally we "own" amazonaws.com and github.io, so this is a faithful rehearsal
# of the real thing without touching anyone's infrastructure.
server {
    listen 80 default_server;
    server_name _;
    location / { return 404 "unclaimed\n"; }
}
server {
    listen 80;
    server_name lab-victim.s3.amazonaws.com;
    location / {
        default_type application/xml;
        return 404 '<?xml version="1.0"?><Error><Code>NoSuchBucket</Code><Message>The specified bucket does not exist</Message><BucketName>lab-victim</BucketName></Error>';
    }
}
server {
    listen 80;
    server_name lab-victim.github.io;
    location / {
        default_type text/html;
        return 404 "<h1>404</h1><p>There isn't a GitHub Pages site here.</p>";
    }
}
server {
    listen 80;
    server_name lab-victim.herokudns.com;
    location / {
        default_type text/html;
        return 404 "<html><body><h1>No such app</h1></body></html>";
    }
}
