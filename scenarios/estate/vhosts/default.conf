# Many names on one host. A scanner that reports 8 hosts here instead of 1
# has a deduplication problem, which is invisible against 127.0.0.1.
server {
    listen 80 default_server;
    server_name _;
    location / { default_type text/html; return 200 '<h1>lime vhost</h1><p>unknown host</p>'; }
}
server {
    listen 80;
    server_name shop.lab.test;
    location / { default_type text/html; return 200 '<h1>shop</h1><p>vhost shop.lab.test on 10.66.10.20</p>'; }
}
