options {
    directory "/var/cache/bind";
    recursion no;
    listen-on { any; };
    listen-on-v6 { none; };
    dnssec-validation no;
    // BIND 9.20 changed the default from { any; } to none. Set per zone below
    // so the open and closed cases are both explicit and both testable.
    allow-transfer { none; };
};

zone "lab.test" {
    type master;
    file "/etc/bind/lab.test.db";
    allow-transfer { any; };          // AXFR succeeds: the enumerable case
};

zone "closed.test" {
    type master;
    file "/etc/bind/closed.test.db";
    allow-transfer { none; };         // AXFR REFUSED: not "zero subdomains"
};

zone "66.10.in-addr.arpa" {
    type master;
    file "/etc/bind/reverse.db";
    allow-transfer { any; };
};
