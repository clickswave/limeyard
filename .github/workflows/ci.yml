# What a push has to survive. Nothing here starts a target: the lab's own
# invariants are file-level, and the two images just have to build.
name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

env:
  LIMEYARD_DIR: ${{ github.workspace }}
  LIME_TOKEN: ci-only-never-used

jobs:
  lab:
    name: manifests, truth, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: control plane compiles
        run: python -m compileall -q control/limed
      - name: every answer key loads and merges
        run: python control/limed/lime.py truth > /dev/null
      - name: every target credits its author
        run: python control/limed/lime.py credits > /dev/null
      # _credits_markdown has always said CI keeps the front page from drifting
      # from the manifests. It did not, and that is how two targets sat on the
      # README claiming a licence they were not under.
      - name: the README credits table matches the manifests
        run: |
          python control/limed/lime.py credits --markdown > "$RUNNER_TEMP/gen.md"
          marker='<!-- generated by `lime credits --markdown`; do not edit by hand -->'
          awk -v m="$marker" 'index($0,m){f=1} f' README.md > "$RUNNER_TEMP/have.md"
          if ! diff -u <(printf '%s\n' "$(cat "$RUNNER_TEMP/have.md")") \
                       <(printf '%s\n' "$(cat "$RUNNER_TEMP/gen.md")"); then
            echo "::error::README credits section is stale. Run ./lime credits --markdown and paste it in."
            exit 1
          fi

      - name: container hardening and supply chain invariants
        run: python control/limed/lime.py audit
      - name: doctor
        # Docker is present on the runner, so this checks what it can:
        # attribution, compose files, answer keys, disk. Networks are absent
        # until a first start and that is reported, not failed.
        run: python control/limed/lime.py doctor

  ui:
    name: control panel builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control/ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control/ui/package-lock.json
      - run: npm ci
      - run: npm run build

  install:
    name: installer, end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: compose config is valid
        run: docker compose config -q
      - name: install.sh parses and lints
        run: |
          bash -n install.sh
          shellcheck -S warning install.sh || true

      # The requirement checks are the half of the script most users meet
      # first, and the half no happy-path test touches.
      - name: it refuses a machine without docker
        run: |
          # PATH is replaced wholesale, so the shell the script runs under has
          # to be on it as well as the tools the script calls.
          mkdir -p "$RUNNER_TEMP/bin"
          for t in bash sh git uname head od tr openssl; do ln -sf "$(command -v $t)" "$RUNNER_TEMP/bin/$t"; done
          out=$(PATH="$RUNNER_TEMP/bin" bash install.sh </dev/null 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "Docker is not installed"

      # The real thing: clone this checkout, write .env, build both images,
      # start the control plane, hand over to the wizard. --none so it starts
      # no targets and pulls no fleet.
      - name: it installs
        run: |
          # install.sh asks for main by name, and the runner has checked out
          # only the branch under test. Give that branch a name it can ask for,
          # so CI installs the code in the pull request rather than main.
          git branch -f ci-under-test HEAD
          bash install.sh --none
        env:
          LIMEYARD_REPO: ${{ github.workspace }}
          LIMEYARD_DIR: ${{ runner.temp }}/lab
          LIMEYARD_REF: ci-under-test

      - name: and the lab it installed works
        working-directory: ${{ runner.temp }}/lab
        run: |
          grep -qE '^LIME_TOKEN=.{16,}' .env
          curl -fsS --retry 10 --retry-delay 2 --retry-all-errors http://127.0.0.1:7000/ -o /dev/null
          curl -fsS http://127.0.0.1:7099/api/health | grep -q '"ok": true'
          ./lime status
          ./lime doctor
      - name: teardown
        if: always()
        # Not working-directory: an earlier failure means there is no lab to
        # tear down, and a missing directory must not fail the job twice.
        run: cd "$RUNNER_TEMP/lab" 2>/dev/null && docker compose down -v || true
