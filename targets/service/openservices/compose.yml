# Unauthenticated by default is the stock behaviour of most official images, so
# this is configuration rather than engineering. No host ports: these live on
# the lab network with static IPs so pulse sweeps a subnet and scout fingerprints
# real daemons rather than being handed a loopback port list.

# Hardened by limeyard. These containers are deliberately vulnerable and we
# achieve RCE inside them on purpose, so the container is the security boundary:
#   no-new-privileges  a setuid binary inside cannot escalate
#   cap_drop ALL       capabilities added back one at a time, per image
#   pids_limit         a fork bomb stays inside its own container
#   mem_limit          a DoS target cannot take the host down with it
# Run `./lime audit` to check these invariants still hold.

networks:
  lime-lab:
    external: true
services:
  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    networks:
      lime-lab:
        ipv4_address: 10.66.20.10
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add: &id001
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
    pids_limit: 512
    mem_limit: 768m
  mongo:
    image: mongo:7@sha256:b6421fd6d1c5ded6377b397d8983e2f82e2100dc5123332dcfda2065a472be5b
    networks:
      lime-lab:
        ipv4_address: 10.66.20.11
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add: *id001
    pids_limit: 512
    mem_limit: 1g
  memcached:
    image: memcached:1.6-alpine@sha256:c29847751abb41f4c268c84fb3087fee05d4edcbda44409ccb5086e26148e8a7
    networks:
      lime-lab:
        ipv4_address: 10.66.20.12
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add: *id001
    pids_limit: 512
    mem_limit: 768m
  registry:
    image: registry:3@sha256:1be55279f18a2fe1a74edf2664cac61c1bea305b7b4642dab412e7affdcb3e33
    networks:
      lime-lab:
        ipv4_address: 10.66.20.13
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    pids_limit: 512
    mem_limit: 768m
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    networks:
      lime-lab:
        ipv4_address: 10.66.20.14
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add: *id001
    pids_limit: 512
    mem_limit: 1g
  mysql:
    image: mysql:8.0@sha256:62fb722c78b24245ddff1796a0fcee4a49cc5b87e0aaaf20c92d1da9e0a2497b
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    networks:
      lime-lab:
        ipv4_address: 10.66.20.15
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add: *id001
    pids_limit: 512
    mem_limit: 1g
  ftp:
    image: delfer/alpine-ftp-server:latest@sha256:3ad587aa1b0822a54e3f570fdcd87e2c2a2c5b27537b2780d97f1284b6872914
    networks:
      lime-lab:
        ipv4_address: 10.66.20.16
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - SETGID
    - SETUID
    - NET_BIND_SERVICE
    - SYS_CHROOT
    pids_limit: 512
    mem_limit: 768m
  prometheus:
    image: prom/prometheus:latest@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    networks:
      lime-lab:
        ipv4_address: 10.66.20.17
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    pids_limit: 512
    mem_limit: 768m
