# NOTE: upstream's own docker-compose.yml now pulls ollama + phi3:mini for its
# LLMForge module, several GB you do not need. This runs the app directly.

# Hardened by limeyard. These containers are deliberately vulnerable and we
# achieve RCE inside them on purpose, so the container is the security boundary:
#   no-new-privileges  a setuid binary inside cannot escalate
#   cap_drop ALL       capabilities added back one at a time, per image
#   pids_limit         a fork bomb stays inside its own container
#   mem_limit          a DoS target cannot take the host down with it
# Run `./lime audit` to check these invariants still hold.

networks:
  lime-web:
    external: true
services:
  vulnerableapp:
    image: sasanlabs/owasp-vulnerableapp:latest@sha256:ab5476ef4a3c175c12c890f004dfbaf78e656b4d6d210a3281ad9d18a40ae525
    ports:
    - 127.0.0.1:7101:9090
    networks:
    - lime-web
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    pids_limit: 512
    mem_limit: 1500m
