target: vulnerableapp
scoring: findings

note: >-
  This target serves its own answer key, so we do not restate it. `GET
  /VulnerableApp/scanner/dast` returns a row per case of (url, vulnerability
  type, variant), where variant SECURE marks the deliberately-safe twin of a
  vulnerable level. Those are the false-positive controls, and they are why
  this target matters more than its vulnerability count suggests.

  Read live on 2026-10-01: 155 rows, 138 UNSECURE and 17 SECURE, across 38
  distinct vulnerability types. The counts move with the image, so resolve the
  list rather than trusting them; an earlier version of this note said 154 rows
  and 38 SECURE endpoints, and both had drifted.

  Mind the context path. Spring Boot serves this app under `/VulnerableApp`,
  not at the root, and both URLs here pointed at the root until 2026-10-01, so
  the declared answer key was a 404.

  It also grades: POST /VulnerableApp/scanner/benchmark with findings as
  {tool, scanType: "DAST", findings: [{url, type|cwe|wascId, method}]} returns
  coverage, missedItems and unmatchedItems. Intersect unmatchedItems with the
  SECURE url set and you have a measured false-positive count.

  Reachability, measured 2026-10-02 and the thing to understand before reading
  any score from here. These levels are JSON endpoints that return a bare
  object and expose no HTML form, and their injection surface is undocumented
  query parameters. Those appear in no spec and on no page, so a crawl and a
  Web Tracer capture both yield nothing, and cortex takes its parameters from
  the asset graph. With none observed, only the passive checks fire: a pass over
  145 endpoints returned 28 findings, all of them no-rate-limit or
  excessive-exposure, and 0 of 117.

  Handing it parameters found by differential probing took SQLi from 0/9 to 4/9
  with no engine change. So a low number here is a statement about parameter
  discovery, not about detection, and the honest fix is query-parameter name
  discovery: `cortex discover` does calibrated brute-force for body fields only.
  A 68-word probe found `id` on ten SQLi levels, `username` on three LDAP levels
  and `password` on eleven crypto levels in seconds.

  If you build that, calibrate for determinism first. The PersistentXSS levels
  store on every request, so identical input gives a different response and
  every candidate looks like a hit.

  Two of its SQL injection entries are not injectable, checked 2026-10-02.
  ErrorBasedSQLInjection levels 3 and 4 quote the value and strip the single
  quote: `1' OR '1'='1` arrives as `id='1 OR 1=1'`, with the payload's own
  quotes removed, so nothing escapes the string literal and every payload ends
  as an H2 data-conversion error. The SQL statement is leaked in that error,
  which is a real information disclosure, but the key labels both
  ERROR_BASED_SQL_INJECTION and they are not. Level 1 concatenates unquoted and
  level 2 quotes without escaping, so those two are genuinely injectable and
  are detected.

  So a perfect score against this key is not achievable and should not be
  chased. Of its nine SQL injection cases: four detected, two not injectable as
  above, two unreachable because no parameter was discovered on those paths, and
  BlindSQLInjection level 2 answers 500 to every value containing a space,
  including `1 AND 1=1`, so there is no oracle to read.

  Calibration: upstream commits ZAP's own results, which sit at 3.9% coverage
  on the legacy UI and 0.0% on the React one. A low score here is normal and is
  not by itself evidence of an engine bug; check URL normalisation and seed the
  endpoint list from /scanner/dast before concluding anything.

external:
  type: http
  url: http://vulnerableapp:9090/VulnerableApp/scanner/dast
  format: vulnerableapp-dast
  # POST only, so it is not fetched during resolution. The answer key above is
  # enough to score locally; this is here for a submit-and-grade comparison.
  grader: http://vulnerableapp:9090/VulnerableApp/scanner/benchmark

expected: []
negative: []
