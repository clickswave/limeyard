target: vulnerableapp
scoring: findings

note: >-
  This target serves its own answer key, so we do not restate it. `GET
  /VulnerableApp/scanner/dast` returns a row per case of (url, vulnerability
  type, variant), where variant SECURE marks the deliberately-safe twin of a
  vulnerable level. Those are the false-positive controls, and they are why
  this target matters more than its vulnerability count suggests.

  Read live on 2026-10-01: 155 rows, 138 UNSECURE and 17 SECURE, across 38
  distinct vulnerability types. The counts move with the image, so resolve the
  list rather than trusting them; an earlier version of this note said 154 rows
  and 38 SECURE endpoints, and both had drifted.

  Mind the context path. Spring Boot serves this app under `/VulnerableApp`,
  not at the root, and both URLs here pointed at the root until 2026-10-01, so
  the declared answer key was a 404.

  It also grades: POST /VulnerableApp/scanner/benchmark with findings as
  {tool, scanType: "DAST", findings: [{url, type|cwe|wascId, method}]} returns
  coverage, missedItems and unmatchedItems. Intersect unmatchedItems with the
  SECURE url set and you have a measured false-positive count.

  Reachability, measured 2026-10-02 and the thing to understand before reading
  any score from here. These levels are JSON endpoints that return a bare
  object and expose no HTML form, and their injection surface is undocumented
  query parameters. Those appear in no spec and on no page, so a crawl and a
  Web Tracer capture both yield nothing, and cortex takes its parameters from
  the asset graph. With none observed, only the passive checks fire, and that
  was the whole score for a while: a pass over 145 endpoints returned 28
  findings, all of them no-rate-limit or excessive-exposure, and none of the
  key's cases. Discovery supplies those parameters now, see below.

  Those 28 stay in `unmatched` and are not a scoring bug. Both are verified by
  construction rather than inferred: the rate-limit check sends 20 requests to
  a sensitive path under an identity that cannot exist and reports only when
  none of them is throttled. The key documents neither class, and limeyard's
  class list has no name for the first, so they are recorded here instead of
  being re-derived every time somebody reads a card from this target.

  Handing it parameters found by differential probing took SQLi from 0/9 to 4/9
  with no engine change, which is why a low number here was a statement about
  parameter discovery rather than about detection.

  Query-parameter name discovery is built, so that is no longer the gate.
  `cortex discover` finds 31 parameters across these 145 endpoints on its own:
  `id` on ten levels, `comment` on six, `src` and `q` on five each, `password`
  on four. discovered-params.json beside this file is what it found, committed
  so a run is reproducible and so the endpoints that still have no parameter,
  and therefore no injection point at all, are visible rather than inferred.

  The determinism warning was right and cost three defects to get past. The
  PersistentXSS levels store on every request, so a single shared marker makes
  every candidate probed after the first real hit look like a hit, a baseline
  taken before the pass is stale the moment anything lands, and the drift guard
  then correctly discards all 40 candidates and finds nothing. A marker derived
  from each candidate's own name and a re-baseline after each confirmed hit are
  what got `comment` out of it.

  Four reflected XSS the key does not document, hand-checked 2026-10-02 and
  promoted into `expected` below. ErrorBasedSQLInjection levels 1 to 4 echo the
  `id` parameter into the H2 error message with `<`, `>` and the tag intact, so
  `<img src=x onerror=...>` comes back raw and runs.

  They are worth reading closely, because a careless check calls them false
  positives. Asked with no Accept header the response is
  `text/plain;charset=UTF-8`, which a browser renders as text and never
  executes, so a curl check says inert. Asked the way a browser asks, with
  `Accept: text/html,...`, the same request answers `text/html;charset=UTF-8`
  and the tag is live. The content type is a property of the request, and the
  question an XSS oracle has to ask is the one a victim's browser asks. cortex
  sends a browser Accept header and was right; the hand check was wrong.

  Two of its SQL injection entries are not injectable, checked 2026-10-02.
  ErrorBasedSQLInjection levels 3 and 4 quote the value and strip the single
  quote: `1' OR '1'='1` arrives as `id='1 OR 1=1'`, with the payload's own
  quotes removed, so nothing escapes the string literal and every payload ends
  as an H2 data-conversion error. The SQL statement is leaked in that error,
  which is a real information disclosure, but the key labels both
  ERROR_BASED_SQL_INJECTION and they are not. Level 1 concatenates unquoted and
  level 2 quotes without escaping, so those two are genuinely injectable and
  are detected.

  So a perfect score against this key is not achievable and should not be
  chased. Of its nine SQL injection cases: four detected, two not injectable as
  above, two unreachable because no parameter was discovered on those paths, and
  BlindSQLInjection level 2 answers 500 to every value containing a space,
  including `1 AND 1=1`, so there is no oracle to read.

  Calibration: upstream commits ZAP's own results, which sit at 3.9% coverage
  on the legacy UI and 0.0% on the React one. A low score here is normal and is
  not by itself evidence of an engine bug; check URL normalisation and seed the
  endpoint list from /scanner/dast before concluding anything.

external:
  type: http
  url: http://vulnerableapp:9090/VulnerableApp/scanner/dast
  format: vulnerableapp-dast
  # POST only, so it is not fetched during resolution. The answer key above is
  # enough to score locally; this is here for a submit-and-grade comparison.
  grader: http://vulnerableapp:9090/VulnerableApp/scanner/benchmark

# Entries the upstream key does not carry. Kept here because upstream's key is
# upstream's, and schema.md says a local entry beside an `external:` block is
# merged rather than replaced. Every one is hand-checked, with the evidence in
# the note above.
expected:
  - id: errorbasedsqlinjectionvulnerability-level_1:reflected_xss
    class: xss-reflected
    scope: black-box
    where:
      path: /VulnerableApp/ErrorBasedSQLInjectionVulnerability/LEVEL_1
      method: GET
      param: id
      in: query
    confirm: >-
      id is concatenated into the SQL and the statement is echoed in the H2
      error. Under a browser Accept header the response is text/html and
      `<img src=x onerror=alert(1)>` comes back raw.
  - id: errorbasedsqlinjectionvulnerability-level_2:reflected_xss
    class: xss-reflected
    scope: black-box
    where:
      path: /VulnerableApp/ErrorBasedSQLInjectionVulnerability/LEVEL_2
      method: GET
      param: id
      in: query
    confirm: >-
      as level 1, with the value quoted. The quotes do not escape the tag.
  - id: errorbasedsqlinjectionvulnerability-level_3:reflected_xss
    class: xss-reflected
    scope: black-box
    where:
      path: /VulnerableApp/ErrorBasedSQLInjectionVulnerability/LEVEL_3
      method: GET
      param: id
      in: query
    confirm: >-
      the single quote is stripped, which is why this level is not injectable
      for SQL, but the angle brackets are not, so the XSS stands.
  - id: errorbasedsqlinjectionvulnerability-level_4:reflected_xss
    class: xss-reflected
    scope: black-box
    where:
      path: /VulnerableApp/ErrorBasedSQLInjectionVulnerability/LEVEL_4
      method: GET
      param: id
      in: query
    confirm: >-
      as level 3, prepared statement, same data-conversion error and the same
      raw reflection of the tag.

negative: []
