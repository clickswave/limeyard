target: vulnerableapp
scoring: findings

note: >-
  This target serves its own answer key, so we do not restate it. `GET
  /VulnerableApp/scanner/dast` returns a row per case of (url, vulnerability
  type, variant), where variant SECURE marks the deliberately-safe twin of a
  vulnerable level. Those are the false-positive controls, and they are why
  this target matters more than its vulnerability count suggests.

  Read live on 2026-10-01: 155 rows, 138 UNSECURE and 17 SECURE, across 38
  distinct vulnerability types. The counts move with the image, so resolve the
  list rather than trusting them; an earlier version of this note said 154 rows
  and 38 SECURE endpoints, and both had drifted.

  Mind the context path. Spring Boot serves this app under `/VulnerableApp`,
  not at the root, and both URLs here pointed at the root until 2026-10-01, so
  the declared answer key was a 404.

  It also grades: POST /VulnerableApp/scanner/benchmark with findings as
  {tool, scanType: "DAST", findings: [{url, type|cwe|wascId, method}]} returns
  coverage, missedItems and unmatchedItems. Intersect unmatchedItems with the
  SECURE url set and you have a measured false-positive count.

  Calibration: upstream commits ZAP's own results, which sit at 3.9% coverage
  on the legacy UI and 0.0% on the React one. A low score here is normal and is
  not by itself evidence of an engine bug; check URL normalisation and seed the
  endpoint list from /scanner/dast before concluding anything.

external:
  type: http
  url: http://vulnerableapp:9090/VulnerableApp/scanner/dast
  format: vulnerableapp-dast
  # POST only, so it is not fetched during resolution. The answer key above is
  # enough to score locally; this is here for a submit-and-grade comparison.
  grader: http://vulnerableapp:9090/VulnerableApp/scanner/benchmark

expected: []
negative: []
