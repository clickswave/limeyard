target: xssmaze
scoring: findings

note: >-
  Serves its own ground truth, so we do not restate it. /map/json describes
  every endpoint with its class, delivery channel, sources, sinks and an
  `exploitable` flag; /solutions.json is the answer key with the expected
  payload and a working exploit URL per maze, and fills `confirm` on resolve.

  Read live on 2026-10-01: 1064 endpoints, 1037 exploitable and 27 not, 1040
  reaching the server and 24 client only. An earlier version of this note said
  1031, which is the GET count rather than the total. Resolve the map rather
  than trusting a number written down here.

  Two properties make it unusually fair to score against. It has a beacon at
  /beacon/<token>: a payload that merely reflects cannot reach it, so a finding
  is execution rather than appearance. And each endpoint declares a `reach` of
  server or client, so DOM-only flows that never touch an HTTP response can be
  excluded from a request-only denominator instead of counting as misses.

  The `reach` flag is wrong in one direction, and reach.json is the measured
  correction. Probed 2026-10-01T23:25Z, 95 endpoints declaring `reach: server`
  never put the request bytes in any response: the value is read back on the
  client out of location.search (52 of them), localStorage, document.referrer,
  history.state or a message event. 93 are DOM cases and 2 are prototype
  pollution, and they behave exactly like the 24 declared `reach: client`. Left
  in the denominator they read as 95 scanner misses that no request-only engine
  could ever convert, which is measuring the protocol rather than the scanner.
  `lime reach xssmaze --write` reproduces the file; truth/schema.md has the
  rules that keep the correction conservative, and 8 endpoints the probe could
  not deliver to stay in the denominator rather than being assumed either way.

  Three reflected XSS the map does not document, promoted into `expected`
  above and hand-checked 2026-10-02. prototype-pollution levels 1 to 3 reflect
  the query value raw inside `JSON.parse('HERE')` in an inline script, so a
  `</script>` in the payload closes the script element at the tokenizer and
  whatever follows is parsed as markup. The map documents the pollution gadget
  on each of those endpoints, which is a different and also real bug, and
  cortex has no prototype-pollution oracle: it reports the XSS, which was
  landing in `unmatched` on every run while proto-pollution scored 0 of 3. Both
  statements are now true on the card at once, which is the point.

  On the 81 DOM endpoints whose bytes do reach a response, cortex finds 76. Of
  the five it misses, four are cases where what it sees is genuinely inert and
  suppressing it is correct: percent-encoded inside a `<script src>` URL
  (domsource-level4) or inside a JS string literal with no breakout
  (modern-level1), entity-encoded as an explicit decoy (modern-level4), and a
  stripped handler whose real path is DOM clobbering (modern-bypass-level2).
  Those four need the page's JavaScript read, not another payload, so they
  belong to a browser-backed tier rather than to a request-only recall figure.
  The fifth, dom-level28, is a real engine gap: the injection point is a path
  segment, the server does reflect it, and cortex only tests named parameters.
  path-level1 through level4, edge-level2 and realworld_input-level7 are the
  same gap in the reflected-html class.

  What the 76 remaining misses are, grouped 2026-10-02 so the next reader does
  not re-derive them from a list of ids. 32 want a tag payload the filter
  family in front of them blocks, and that bucket has the worst return of
  anything here: sixteen candidate payloads were measured against it and
  fourteen recovered nothing the other two did not, so the next one is per
  family rather than general. 7 want an encoding layer beyond the three the
  engine tries and 4 want base64, sometimes twice. 6 want a handler name
  outside the one unlisted handler the engine carries. 6 put an HTML entity
  inside the payload. 5 are DOM flows that need the page's JavaScript read and
  4 are JS-string breakouts the oracle will not claim without it, which is the
  same browser-tier boundary. 3 are prototype pollution, where the engine has
  no oracle and reports the reflected XSS beside it instead. 3 are stored
  through a separate JSON API or behind a session. The rest are single cases:
  fullwidth lookalike characters, a javascript: URL, a template literal, and
  one payload with no alphanumerics in it.

  Measured end to end on 2026-10-02, mach crawl into cortex inject rather than
  handing cortex this map's endpoint list. The crawl returns 2328 endpoints and
  reaches 918 of the 918 paths this key expects a finding on, so discovery is
  not the limit on this target: it links everything from its index, which a
  real application does not. End-to-end recall is 830 of 921 against 845 when
  cortex is handed the key's own list, and all 15 of the difference are channel
  fidelity rather than discovery. 6 are path-segment injections, which a crawl
  cannot infer without a spec; 5 are the querymethod family, which only answer
  HTTP QUERY; 3 need a JSON body where the crawl reports a form; 1 is JSONP.

  Do not read wall-clock scan time off this target. A 300-endpoint pass sends
  about 22,000 requests, and the engine's own pass log attributes 65 of its 95
  seconds to pacing back-off with 0 seconds spent waiting on the target. The
  same 300 endpoints also completed three times in a row in under a second on
  a fresh daemon, so the figure swings by around 100x between passes with no
  change to the work. Something in the pacer decides differently on identical
  input and that is worth chasing, but until it is, any timing measured here is
  a measurement of the pacer.

  27 endpoints are marked exploitable:false. Those are the precision controls,
  and reporting one is a false positive. They resolve into `negative` with no
  class, so reporting anything at all on one counts against precision.

external:
  type: http
  url: http://xssmaze:3000/map/json
  format: xssmaze-map
  solutions: http://xssmaze:3000/solutions.json

# Entries the upstream map does not carry, merged with it rather than replacing
# it (truth/schema.md, "reach.json" and the external section). The ids are
# deliberately not upstream's endpoint names: a local entry wins on id, so
# reusing one would delete the case it was meant to sit beside.
expected:
  - id: prototype-pollution-level1:reflected_xss
    class: xss-reflected
    scope: black-box
    where: {method: GET, path: /prototype-pollution/level1, param: query, in: query}
    confirm: >-
      Hand-checked 2026-10-02. The query value is reflected raw inside
      `JSON.parse('HERE')` in an inline script, so `</script><svg onload=...>`
      closes the script element at the tokenizer and the svg is parsed as
      markup and runs. text/html, no CSP. Upstream documents the prototype
      pollution gadget on this endpoint and not this, which is why cortex's
      finding was landing in `unmatched` on every run.
  - id: prototype-pollution-level2:reflected_xss
    class: xss-reflected
    scope: black-box
    where: {method: GET, path: /prototype-pollution/level2, param: query, in: query}
    confirm: as level 1, reflected into `JSON.parse('HERE')` in an inline script.
  - id: prototype-pollution-level3:reflected_xss
    class: xss-reflected
    scope: black-box
    where: {method: GET, path: /prototype-pollution/level3, param: query, in: query}
    confirm: as level 1, reflected into `JSON.parse('HERE')` in an inline script.

negative: []
