target: faultline
scoring: findings
expected:
- id: FL1
  class: cors
  severity: high
  scope: black-box
  confirm: sentinel origin reflected alongside allow-credentials
  where:
    method: GET
    path: /api/v1
  note: Four routes are affected (/api/v1, /api/v1/users/{id}, /api/v2/user/dashboard, /graphql). The
    path here names one of them; the finding is the same misconfiguration on all four.
- id: FL2
  class: bola
  severity: high
  scope: authed
  confirm: cross-identity replay
  where:
    method: GET
    path: /api/v1/users/{id}
    in: path
  note: 'Path corrected 2026-09-09: the key said /api/customers/{id}, which is a 404. The real object
    route is /api/v1/users/{id}, which answers 401 unauthenticated. The original path came from prose
    in an older scorecard and was never checked against the app.'
- id: FL3
  class: excessive-exposure
  severity: medium
  scope: authed
  confirm: response carries ssn and apiKey for every user
  where:
    method: GET
    path: /api/v1/admin/users
  note: >-
    Path corrected again 2026-09-10. /api/v1/users does not exist: main.rs wires
    /api/v1/users/:id and /api/v1/admin/users, and the listing is the admin one.
    The 2026-09-09 correction moved it to a route that 404s, so the entry could
    still only ever be a miss.

    Verified by hand with an admin session: the response carries id, email,
    fullName, role, phone, ssn, balanceCents and apiKey for every user. The
    handler says so itself - "Intentionally leaks ssn + apiKey". Reaching it
    needs an admin bearer token, which is why the scope is authed.
- id: FL4
  class: info-disclosure
  severity: high
  scope: out-of-scope
  where:
    path: /
  note: H1 plaintext password storage; code-level, no black-box oracle
- id: FL5
  class: auth-bypass
  severity: medium
  scope: out-of-scope
  where:
    path: /api/auth/login
  note: D12 no account lockout; rate and logic
negative: []
