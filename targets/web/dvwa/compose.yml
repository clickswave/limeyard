# DVWA + its OWN MariaDB. The db stays on the project-private network and is
# never published to the host. Web on 127.0.0.1:7002 + shared lime-web.

# Hardened by limeyard. These containers are deliberately vulnerable and we
# achieve RCE inside them on purpose, so the container is the security boundary:
#   no-new-privileges  a setuid binary inside cannot escalate
#   cap_drop ALL       capabilities added back one at a time, per image
#   pids_limit         a fork bomb stays inside its own container
#   mem_limit          a DoS target cannot take the host down with it
# Run `./lime audit` to check these invariants still hold.

services:
  dvwa:
    image: ghcr.io/digininja/dvwa:latest@sha256:f332a2356b819df77fde5c5453b658ce222c82f909bdd35bc711019e0e89392c
    restart: unless-stopped
    depends_on:
    - dvwa-db
    environment:
    - DB_SERVER=dvwa-db
    - DB_DATABASE=dvwa
    - DB_USERNAME=dvwa
    - DB_PASSWORD=p@ssw0rd
    ports:
    - 127.0.0.1:7002:80
    networks:
    - default
    - lime-web
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
    - NET_BIND_SERVICE
    - KILL
    pids_limit: 512
    mem_limit: 768m
  dvwa-db:
    image: docker.io/library/mariadb:10@sha256:de61fed4a40d3842f3ee09944ba52792156cfd9adf489b2cc670fc6ded28df8d
    restart: unless-stopped
    environment:
    - MYSQL_ROOT_PASSWORD=dvwa
    - MYSQL_DATABASE=dvwa
    - MYSQL_USER=dvwa
    - MYSQL_PASSWORD=p@ssw0rd
    volumes:
    - dvwa-db:/var/lib/mysql
    networks:
    - default
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
    pids_limit: 512
    mem_limit: 1g
volumes:
  dvwa-db: null
networks:
  lime-web:
    external: true
  default:
    internal: true
