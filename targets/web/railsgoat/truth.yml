target: railsgoat
scoring: findings

note: >-
  Added for three properties nothing else in the lab has: a Ruby stack, a
  session and CSRF model that defeats naive crawlers, and a real deserialization
  sink reachable without authentication.

expected:
  - id: RG1
    class: deserialization
    severity: critical
    scope: black-box
    confirm: Marshal.load of a base64 parameter
    where: {method: POST, path: /password_resets, param: user, in: body}
    note: >-
      Path corrected 2026-09-09. The key said GET /password_resets/edit, which
      does not exist in this build: routes.rb wires `post "password_resets" =>
      "password_resets#reset_password"`, and that action calls
      Marshal.load(Base64.decode64(params[:user])). The old path answered 404
      with a Rails routing error, so nothing could ever have found it.

      Ruby has no URLDNS-equivalent universal gadget, so a scanner carrying only
      a Java gadget chain scores zero here regardless. Reaching the endpoint at
      all is also a discovery problem: the form is rendered only after a valid
      reset token, so a crawl never sees it and content discovery has to guess
      the route. Expect this to read as a discovery gap, and that is the honest
      result rather than a reason to move the entry out of scope.
  - id: RG2
    class: bola
    severity: high
    scope: authed
    confirm: cross-identity replay on a nested resource
    where: {method: GET, path: "/users/{user_id}/work_info", in: path}
    note: routes.rb nests retirement, paid_time_off, work_info and performance under users.
  - id: RG3
    class: sqli
    severity: high
    scope: authed
    confirm: error-based
    where: {method: GET, path: /users, param: q, in: query}
  - id: RG4
    class: session
    severity: medium
    scope: out-of-scope
    confirm: anti-CSRF token present on every form
    where: {method: GET, path: /login}
    note: >-
      Not a vulnerability, and no scanner should report it, so scoring it as an
      expected finding was wrong: it could only ever be a permanent miss.
      Rescoped 2026-09-09 and kept as documentation of why this target is here.
      The property it describes is real and is measured properly by RG2 and RG3,
      which are only reachable if the crawl carries the token and the signed
      session cookie. The path is also corrected: the app links /login, and
      /sessions/new is the internal route name.
  - id: RG5
    class: xss-stored
    severity: medium
    scope: out-of-scope
    where: {path: /benefit_forms}
    note: behind auth plus CSRF

negative: []
