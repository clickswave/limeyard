# RailsGoat. The published image defaults to `irb`, so the command is explicit.
# Sqlite, so no database tier. Rails binds 3000, above 1024, so no capabilities
# are needed at all.
networks:
  lime-web:
    external: true

services:
  railsgoat:
    image: owasp/railsgoat:main@sha256:ec7a1ad57aad9d62070e7e725f9b98d64ea0f946c2ed94ee4efa9a0037ba5ac5
    command: >-
      bash -c "cd /myapp && (bundle exec rails db:setup || true) &&
      rm -f tmp/pids/server.pid && bundle exec rails s -p 3000 -b 0.0.0.0"
    ports: ["127.0.0.1:7008:3000"]
    networks: [lime-web]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 512
    mem_limit: 1g
