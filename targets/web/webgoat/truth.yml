target: webgoat
scoring: findings

note: >-
  Every WebGoat vulnerability is lesson-gated behind account registration, a
  per-lesson session, CSRF tokens and staged progression. An unauthenticated
  black-box crawl cannot reach any lesson endpoint, so the whole target is
  out-of-scope by construction. It stays in the lab as a crawl barrier and as
  the WebWolf OAST catcher, not as a detection target. Reaching any entry below
  would need a WebGoat-aware authenticated driver.

