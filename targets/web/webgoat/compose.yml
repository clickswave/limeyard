# WebGoat (8080) + WebWolf (9090) in one container. Both bound to loopback.

# Hardened by limeyard. These containers are deliberately vulnerable and we
# achieve RCE inside them on purpose, so the container is the security boundary:
#   no-new-privileges  a setuid binary inside cannot escalate
#   cap_drop ALL       capabilities added back one at a time, per image
#   pids_limit         a fork bomb stays inside its own container
#   mem_limit          a DoS target cannot take the host down with it
# Run `./lime audit` to check these invariants still hold.

services:
  webgoat:
    image: webgoat/webgoat:latest@sha256:3101bd9e7bcfe122d7ef91e690ef3720de36cc4e86b3d06763a1ddf2e2751a4b
    restart: unless-stopped
    environment:
    - TZ=UTC
    - WEBGOAT_HOST=0.0.0.0
    - WEBWOLF_HOST=0.0.0.0
    - WEBGOAT_PORT=8080
    - WEBWOLF_PORT=9090
    ports:
    - 127.0.0.1:7003:8080
    - 127.0.0.1:7004:9090
    networks:
    - lime-web
    healthcheck:
      disable: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    pids_limit: 512
    mem_limit: 1500m
networks:
  lime-web:
    external: true
