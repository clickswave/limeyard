target: vampi
scoring: findings
expected:
- id: VP1
  class: excessive-exposure
  severity: critical
  scope: black-box
  confirm: plaintext passwords in response
  where:
    method: GET
    path: /users/v1/_debug
- id: VP2
  class: excessive-exposure
  severity: high
  scope: black-box
  confirm: public endpoint returns another user's record
  where:
    method: GET
    path: /users/v1/{username}
    in: path
  note: 'Reclassified 2026-09-09. This was scored as BOLA, but the endpoint answers 200 with no session
    at all, so there is no authorization boundary being crossed. The authz engine correctly reports nothing:
    it compares identities, and every identity including none gets the same response. Catching it needs
    an oracle for ''a public endpoint returns personal data'', which is a different capability and does
    not exist today.'
- id: VP3
  class: sqli
  severity: high
  scope: black-box
  confirm: error-based (sqlalchemy/sqlite OperationalError in the body)
  where:
    method: GET
    path: /users/v1/{username}
    in: path
  note: >-
    Path corrected 2026-09-10. The key said /books/v1/{id}, which needs a bearer
    token and shows no injection signal at all: a quote there just means "no
    such book". The raw SQL in this build is in models/user_model.py, get_user,
    which builds SELECT * FROM users WHERE username = '<value>' by
    interpolation.

    That is the same endpoint as VP2, which is realistic rather than a
    duplicate: one endpoint hands out other people's records AND concatenates
    the identifier into SQL. Verified by hand - name1 returns 200, name1'
    returns 500 with sqlalchemy.exc.OperationalError in the body, name1''
    returns 404 with no error, and name1'-- - returns 200.
- id: VP4
  class: exposure
  severity: info
  scope: black-box
  confirm: OpenAPI document served
  where:
    method: GET
    path: /openapi.json
