target: crapi
scoring: findings

expected:
  - id: CR1
    class: bola
    severity: critical
    scope: authed
    confirm: cross-identity replay
    where: {method: GET, path: "/identity/api/v2/vehicle/{vehicleId}/location", in: path}
    # Reconciled 2026-10-02, and the answer was that neither side was wrong.
    # The engine reports `location: endpoint` because the probe that found this
    # compared what two identities get back from one endpoint, and what it
    # proved is that the endpoint is the object. This entry says `in: path`
    # because that is where the object's id lives, which is a fact about the
    # vulnerability rather than about the measurement. `endpoint` is the less
    # specific of two true answers, so the scorer no longer flags it; the
    # engine's other BOLA probe, the one that substitutes an id into the path,
    # does report `path`, because there the location is the evidence.
    note: >-
      Leaks GPS and owner email to a non-owner. The 2026-08-23 run recorded 8
      BOLA findings across vehicle location, mechanic_report, dashboard and the
      community feed.
  - id: CR2
    class: excessive-exposure
    severity: high
    scope: authed
    confirm: response carries other users' fields
    where: {method: GET, path: /community/api/v2/community/posts/recent}
    note: seeds the vehicle UUIDs that make CR1 reachable
  - id: CR3
    class: exposure
    severity: medium
    scope: black-box
    confirm: dotenv served
    where: {method: GET, path: /.env}
  - id: CR6
    class: bola
    severity: critical
    scope: authed
    confirm: two identities receive byte-identical bodies, anonymous gets 401
    where: {method: GET, path: /workshop/api/mechanic/mechanic_report, param: report_id, in: query}
    note: >-
      Any authenticated user reads any mechanic report. Promoted out of
      `unmatched` on 2026-10-02 after the authz op reported it and it was then
      verified by hand rather than taken on the engine's word: report_id 1 to 5
      all answer 200 with byte-identical bodies to two fresh accounts that own
      none of them, while an anonymous caller gets 401. So authentication works
      and only the authorization is missing, which is what separates this from
      CR4.

      The 2026-08-23 note on CR1 already said mechanic_report was among the
      eight BOLA findings that run produced. It was never written down as an
      expected entry, so every run since has scored a real detection as
      unmatched.

  - id: CR4
    class: auth-bypass
    severity: high
    scope: out-of-scope
    where: {path: /identity/api/auth/v3/check-otp}
    note: OTP brute force; rate and logic
  - id: CR5
    class: mass-assignment
    severity: high
    scope: out-of-scope
    where: {path: /workshop/api/mechanic/}
    note: needs a multi-step chain

negative: []
